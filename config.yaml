# Mysu 模型网关配置
# 支持多个 OpenAI 兼容的 provider，统一通过 OpenAI SDK 调用。
#
# 环境变量注入：api_key 值以 $ 开头时从环境变量读取。
#   例: api_key: "$DEEPSEEK_API_KEY" → 读取 os.environ["DEEPSEEK_API_KEY"]

default_model: "qwen3.5:9b"           # 默认使用的模型名
default_max_tokens: 2048               # 单次调用最大输出 token
default_temperature: 0.7               # 默认温度

max_retries: 3                         # 指数退避重试次数
request_timeout: 60                    # 单次 API 调用超时（秒）

providers:
  # ── 本地 Ollama ────────────────────────────────────
  - name: "ollama"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"                  # Ollama 不需要真 key，占位即可
    models:
      - "qwen2.5:3b"
      - "qwen3.5:9b"
      - "qwen2.5:14b"

  # ── DeepSeek ───────────────────────────────────────
  # 启用前设置环境变量: export DEEPSEEK_API_KEY="sk-xxx"
  - name: "deepseek"
    base_url: "https://api.deepseek.com/v1"
    api_key: "$DEEPSEEK_API_KEY"
    models:
      - "deepseek-v4-flash"
      - "deepseek-v4-pro"

  # ── OpenAI ─────────────────────────────────────────
  # 启用前设置环境变量: export OPENAI_API_KEY="sk-xxx"
  # - name: "openai"
  #   base_url: "https://api.openai.com/v1"
  #   api_key: "$OPENAI_API_KEY"
  #   models:
  #     - "gpt-4o"
  #     - "gpt-4o-mini"
